<svg xmlns="http://www.w3.org/2000/svg" width="0.75in" height="0.75in" viewBox="0 0 540 540">
  <!-- The Loxley Forest acorn (loxleyforest.com css/v2.css, viewBox 16 x 20) as a wax-seal mark.
       Drawn for a 0.75 in brass head (Zazzle's custom stamp; a 1 in seal): 540 units = 54 pt, so 10 units = 1 pt.
       For wax: the cap/nut gap is 1.3 acorn units (26 units = 2.6 pt; the site's is 0.9);
       the stem, a hairline on the site, is a 1.45-unit round stroke (29 units = 2.9 pt);
       the ring is 20 units (2 pt). Nothing finer than 1.5 pt. Black is the mark; the rest is clear. -->
  <circle cx="270" cy="270" r="251" fill="none" stroke="#000" stroke-width="20"/>
  <g transform="translate(110 78) scale(20)">
    <path fill="#000" d="M8 2.2C4.6 2.2 1.9 4.6 1.9 7.7H14.1C14.1 4.6 11.4 2.2 8 2.2Z"/>
    <path fill="#000" d="M2.8 9H13.2C13.2 13.5 10.8 17.3 8 19.3C5.2 17.3 2.8 13.5 2.8 9Z"/>
    <path fill="none" stroke="#000" stroke-width="1.45" stroke-linecap="round" d="M8.1 3.2C8.1 1.9 8.7 1 9.8 0.6"/>
  </g>
</svg>
