# Netlify configuration for loxleyforest.com (static multi-page site).
#
# The build step runs scripts/ensure-gtm.js, which guarantees the Google Tag
# Manager container snippet is present on every HTML page of the DEPLOYED site
# — even if a future content edit accidentally strips it from a page's source.
# The snippet itself is defined in ONE place: scripts/ensure-gtm.js.
#
# No bundler/framework is involved; the script edits the static .html files in
# place before Netlify publishes the repo root.

[build]
  command = "python3 scripts/ensure_gtm.py"
  publish = "."
