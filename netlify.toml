# Netlify configuration for loxleyforest.com (static multi-page site).
#
# The build step runs scripts/ensure_gtm.py, which guarantees the Google Tag
# Manager container snippet is present on every HTML page of the DEPLOYED site,
# even if a future content edit accidentally strips it from a page's source.
# The snippet itself is defined in ONE place: scripts/ensure_gtm.py.
# Then scripts/publish.py copies only the site into _site/, which Netlify publishes.

[build]
  # ensure_gtm.py heals the pages; publish.py copies only the site into _site/
  # (working notes, documents and scripts are never published: 2026-10-20).
  command = "python3 scripts/ensure_gtm.py && python3 scripts/publish.py"
  publish = "_site"

# The Canopy Club is retired (Mick, 2026-10-13); old links land on the home page.
[[redirects]]
  from = "/canopy-club"
  to = "/"
  status = 301

[[redirects]]
  from = "/canopy-club.html"
  to = "/"
  status = 301

# Our own checkout replaces Hostfully (Mick, 2026-10-19). The old preview checkout and the
# cancellation page land on /book; Netlify carries the query string along, so a link that
# held dates (?checkIn=...&checkOut=...) still opens checkout on them.
[[redirects]]
  from = "/stay"
  to = "/book"
  status = 301

[[redirects]]
  from = "/stay.html"
  to = "/book"
  status = 301

# The terms live in the booking agreement, shown in full at checkout (Mick, 2026-10-19).
[[redirects]]
  from = "/cancellation"
  to = "/book"
  status = 301

[[redirects]]
  from = "/cancellation.html"
  to = "/book"
  status = 301
